<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ti amo ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Sfondo animato con cuori -->
    <div class="hearts-background">
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
    </div>

    <!-- Proposta -->
    <div class="proposal-container" id="proposalContainer">
        <div class="proposal-box">
            <h1 class="proposal-text">💕 Vuoi essere la mia valentina? 💕</h1>
            <div class="buttons-container">
                <button class="btn btn-yes" id="yesBtn">Sì</button>
                <button class="btn btn-no" id="noBtn">No</button>
            </div>
        </div>
    </div>

    <!-- Messaggio di ringraziamento -->
    <div class="thank-you-container hidden" id="thankYouContainer">
        <div class="thank-you-box">
            <h1 class="thank-you-text">💖 Sì! Grazie! 💖</h1>
            <p class="thank-you-subtext">Sei meravigliosa!</p>
            <div class="kitten-container">
                <img src="https://i.redd.it/gsrkewd1az8f1.gif" alt="Gatto felice" class="happy-kitten">
            </div>
            <p class="thank-you-message">Ti voglio bene! ❤️</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
